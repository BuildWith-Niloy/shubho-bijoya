<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="
#8d201a">
  <meta name="description" content="A little Shubho Bijoya wish, made just for you.">
  <title>Shubho Bijoya — a little wish for you</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=2">
  <script src="script.js?v=5" defer></script>
</head>

<body>
  <main class="greeting-page">

    <div class="petal-layer" id="petalLayer" aria-hidden="true"></div>

    <svg class="eye-blink-layer" id="eyeBlinkLayer" viewBox="0 0 1536 1024" aria-hidden="true" focusable="false">
      <g class="blink-mask">
        <!-- Girl's eyes -->
        <path class="closed-eye girl-eye" d="M430 538 Q444 524 460 531 Q454 544 441 546 Q434 544 430 538Z" />
        <path class="closed-lid girl-lid" d="M430 538 Q444 524 460 531" />
        <path class="closed-eye girl-eye" d="M478 529 Q493 518 509 524 Q503 538 489 541 Q482 538 478 529Z" />
        <path class="closed-lid girl-lid" d="M478 529 Q493 518 509 524" />
        <!-- Boy's eyes, kept inside the glasses rims -->
        <ellipse class="closed-eye boy-eye" cx="601" cy="507" rx="9" ry="11" />
        <path class="closed-lid boy-lid" d="M592 507 Q601 512 610 507" />
        <ellipse class="closed-eye boy-eye" cx="638" cy="507" rx="10" ry="11" />
        <path class="closed-lid boy-lid" d="M628 507 Q638 512 648 507" />
      </g>
    </svg>

    <section class="wish-card" aria-label="Personal Shubho Bijoya greeting">

      <div class="top-ornament" aria-hidden="true">
        <span>—</span>
        <span class="lotus">❀</span>
        <span>—</span>
      </div>

      <p class="eyebrow">a little wish, made just for you</p>

      <div class="typed-message" id="typedMessage" aria-live="polite" aria-label="Your Bijoya greeting">

        <p class="typed-line salutation">
          <span class="typed-text"></span>
          <span class="cursor" aria-hidden="true"></span>
        </p>

        <p class="typed-line divider-line">
          <span class="typed-text"></span>
          <span class="cursor" aria-hidden="true"></span>
        </p>

        <p class="typed-line blessing">
          <span class="typed-text"></span>
          <span class="cursor" aria-hidden="true"></span>
        </p>

        <p class="typed-line signoff">
          <span class="typed-text"></span>
          <span class="cursor" aria-hidden="true"></span>
        </p>

        <p class="typed-line signature">
          <span class="typed-text"></span>
          <span class="cursor" aria-hidden="true"></span>
        </p>

      </div>

    </section>

    <span class="corner-flower flower-one" aria-hidden="true">✿</span>
    <span class="corner-flower flower-two" aria-hidden="true">❀</span>
    <span class="corner-flower flower-three" aria-hidden="true">✽</span>

  </main>
</body>
</html>
